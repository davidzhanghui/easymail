<!doctype html>
<html data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__'; form-action 'none'; base-uri 'none'">
<style>
:root { __VARS__ }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
body { font: 14px/1.7 -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; -webkit-font-smoothing: antialiased; }
#wrap { display: flex; flex-direction: column; height: 100%; }
#scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px 6px; cursor: text; }
#ed { outline: none; min-height: 100%; word-wrap: break-word; overflow-wrap: anywhere; caret-color: var(--accent); }
#ed[data-empty="1"]::before { content: attr(data-ph); color: var(--muted); pointer-events: none; position: absolute; }
#ed img { max-width: 100%; height: auto; border-radius: 4px; }
#ed img.sel { outline: 2px solid var(--accent); }
#ed a { color: var(--accent); }
#ed blockquote { margin: 0 0 0 .8ex; border-left: 2px solid #ccc; padding-left: 1ex; color: var(--muted); }
#ed ul, #ed ol { margin: 4px 0; padding-left: 28px; }
/* 暗色主题：原邮件自带的深色字、白底表头会压在深色背景上看不清。只覆盖显示，序列化时内联样式原样保留 */
html[data-theme="dark"] #ed :is(.q, blockquote), html[data-theme="dark"] #ed :is(.q, blockquote) * { color: var(--muted) !important; background-color: transparent !important; background-image: none !important; border-color: var(--border) !important; }
html[data-theme="dark"] #ed blockquote:not(.webkit-indent-blockquote) { border-left-color: var(--muted) !important; }
html[data-theme="dark"] #ed :is(.q, blockquote) a { color: var(--accent) !important; }
html[data-theme="dark"] #ed :is(.q, blockquote) :is(b, strong, h1, h2, h3, h4, th) { color: var(--fg) !important; }
body.dragging #scroll { background: var(--accent-soft); }
.bar { flex: none; display: flex; align-items: center; gap: 2px; padding: 4px 8px; position: relative; }
#fmt { margin: 0 10px 4px; padding: 3px 6px; border-radius: 10px; background: var(--panel2); flex-wrap: wrap; }
#act { border-top: 1px solid var(--border); padding: 5px 10px; }
.sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 5px; border-radius: 6px; border: 0; background: transparent; color: var(--fg); cursor: pointer; font: 13px/1 -apple-system, 'PingFang SC', sans-serif; white-space: nowrap; user-select: none; -webkit-user-select: none; }
.btn:hover { background: var(--hover); }
.btn.on { background: var(--accent-soft); color: var(--accent); }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn .caret { width: 9px; height: 9px; margin-left: 3px; opacity: .6; stroke-width: 2.4; }
.btn.wide { min-width: 74px; justify-content: space-between; padding: 0 8px; }
#pop { position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.22); padding: 6px; display: none; max-width: calc(100vw - 16px); }
#pop.show { display: block; }
.menu .item { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 6px; cursor: pointer; min-width: 150px; font-size: 13px; }
.menu .item:hover { background: var(--hover); }
.menu .item.cur::before { content: '✓'; width: 12px; }
.menu .item:not(.cur)::before { content: ''; width: 12px; }
.colors { display: grid; grid-template-columns: repeat(10, 22px); gap: 4px; padding: 4px; }
.colors i { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(128,128,128,.35); cursor: pointer; display: block; }
.colors i:hover { transform: scale(1.15); }
.pop-title { font-size: 11px; color: var(--muted); padding: 2px 4px; }
.emojis { width: 332px; }
.emojis .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 4px; }
.emojis .tabs .btn { font-size: 16px; min-width: 32px; }
.emojis .grid { display: grid; grid-template-columns: repeat(9, 34px); gap: 1px; height: 198px; overflow-y: auto; }
.emojis .grid span { font-size: 22px; line-height: 34px; text-align: center; border-radius: 6px; cursor: pointer; font-family: 'Apple Color Emoji', sans-serif; }
.emojis .grid span:hover { background: var(--hover); }
.linkf { width: 330px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.linkf label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; }
.linkf input { width: 100%; height: 30px; border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; background: var(--bg); color: var(--fg); font: 13px -apple-system, 'PingFang SC', sans-serif; outline: none; }
.linkf input:focus { border-color: var(--accent); }
.linkf .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.linkf .row .grow { flex: 1; }
.pbtn { height: 28px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel2); color: var(--fg); cursor: pointer; font-size: 13px; }
.pbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.pbtn.link { border: 0; background: transparent; color: var(--muted); padding: 0 4px; }
</style>
</head>

  '⚽': '⚽🏀🏈⚾🎾🏐🏉🎱🏓🏸🥅🏒🏑🥍🏏⛳🏹🎣🥊🥋🎽🛹⛸🎿🏂🏋🤸🏊🚴🧘🎮🎲🎯🎳🎭🎨🎬🎤🎧🎼🎹🥁🎷🎺🎸🎻',
  '🚗': '🚗🚕🚙🚌🚎🏎🚓🚑🚒🚚🚜🛵🏍🚲🛴🚂🚆🚄🚅✈🛫🛬🚀🛸🚁⛵🚤🛳⚓🏠🏡🏢🏥🏦🏫🏰🗼🗽⛪🕌🗻🏔🏝🏖⛺🌃🌆🌇🌉',
  '💡': '💡🔦📱💻🖥⌨🖱💾📷📹🎥📞☎📺📻⏰⌛⏳💰💵💳💎🔧🔨⚙🔒🔓🔑📦📫📧✉📝📄📃📑📊📈📉📌📎✂🗂📅📆🗑🔍🔎🔔🎵',
  '✔': '✔✅❌❎⭕❗❓‼⁉⚠🚫🔴🟠🟡🟢🔵🟣⚫⚪🔶🔷➕➖➗✖♻💲™©®➡⬅⬆⬇↗↘↙↖↔↕🔄🔃🔙🔚🔛🔜🔝'
};
function emojiList(s) { return Array.from(s).filter((c) => c !== '️'); }
function openPop(kind, anchor) {
  if (popKind === kind) { closePop(); return; }
  closePop(); popKind = kind;
  if (kind === 'font') {
    const cur = btns.font.firstChild.textContent;
    pop.appendChild(menuPop(FONTS.map(([l, v]) => [l, l, 'font-family:' + JSON.stringify(v) + ',sans-serif']), cur, (l) => exec('fontName', FONTS.find((x) => x[0] === l)[1])));
  } else if (kind === 'size') {
    pop.appendChild(menuPop(SIZES.map(([l, v]) => [l, v, 'font-size:' + Math.min(v, 20) + 'px']), 14, setSize));
  } else if (kind === 'align') {
    const m = [['左对齐', 'justifyLeft'], ['居中', 'justifyCenter'], ['右对齐', 'justifyRight'], ['两端对齐', 'justifyFull']];
    pop.appendChild(menuPop(m, '', (c) => exec(c)));
  } else if (kind === 'color') {
    const mkGrid = (title, cmd) => {
      const t = document.createElement('div'); t.className = 'pop-title'; t.textContent = title; pop.appendChild(t);
      const g = document.createElement('div'); g.className = 'colors';
      COLORS.forEach((c) => {
        const i = document.createElement('i'); i.style.background = c; i.title = c;
        i.addEventListener('mousedown', (e) => e.preventDefault());
        i.addEventListener('click', () => { closePop(); exec(cmd, c); if (cmd === 'foreColor') $('#colbar').style.color = c; });
        g.appendChild(i);
      });
      pop.appendChild(g);
    };
    mkGrid('文字颜色', 'foreColor'); mkGrid('背景色', 'hiliteColor');
  } else if (kind === 'emoji') {
    const box = document.createElement('div'); box.className = 'emojis';
    const tabs = document.createElement('div'); tabs.className = 'tabs';
    const grid = document.createElement('div'); grid.className = 'grid';
    const show = (k, t) => {
      tabs.querySelectorAll('.btn').forEach((b) => b.classList.toggle('on', b === t));
      grid.innerHTML = '';
      emojiList(EMOJI[k]).forEach((ch) => {
        const s = document.createElement('span'); s.textContent = ch;
        s.addEventListener('mousedown', (e) => e.preventDefault());
        s.addEventListener('click', () => { closePop(); restore(); document.execCommand('insertText', false, ch); changed(); });
        grid.appendChild(s);
      });
    };
    Object.keys(EMOJI).forEach((k, i) => {
      const b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.textContent = k;
      b.addEventListener('mousedown', (e) => e.preventDefault());
      b.addEventListener('click', () => show(k, b));
      tabs.appendChild(b); if (i === 0) setTimeout(() => show(k, b), 0);
    });
    box.appendChild(tabs); box.appendChild(grid); pop.appendChild(box);
  } else if (kind === 'link') {
    openLink();
  }
  place(anchor);
  const f = pop.querySelector('input'); if (f) { f.focus(); f.select(); }
}
function normUrl(u) {
  u = u.trim(); if (!u) return '';
  if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
  if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';
  if (/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(u)) return 'mailto:' + u;
  return 'https://' + u;
}
function openLink() {
  const a = ancestor('a');
  const selText = a ? a.textContent : (saved ? saved.toString() : '');
  const f = document.createElement('div'); f.className = 'linkf';
  f.innerHTML = '<div><label>显示的文字</label><input id="lk-t" spellcheck="false"></div><div><label>链接地址</label><input id="lk-u" placeholder="https://" spellcheck="false"></div>' +
    '<div class="row"><button class="pbtn link grow" id="lk-rm" type="button" style="text-align:left">移除链接</button><button class="pbtn" id="lk-no" type="button">取消</button><button class="pbtn primary" id="lk-ok" type="button">应用</button></div>';
  pop.appendChild(f);
  const t = f.querySelector('#lk-t'), u = f.querySelector('#lk-u');
  t.value = selText; u.value = a ? a.getAttribute('href') || '' : '';
  f.querySelector('#lk-rm').style.visibility = a ? 'visible' : 'hidden';
  const apply = () => {
    const href = normUrl(u.value);
    if (!href) { u.style.borderColor = '#d33'; u.focus(); return; }
    const text = t.value.trim() || href;
    closePop(); restore();
    const cur = ancestor('a');
    if (cur) {
      cur.setAttribute('href', href);
      if (text !== cur.textContent) cur.textContent = text;
    } else if (saved && !saved.collapsed && text === saved.toString()) {
      document.execCommand('createLink', false, href);
    } else {
      document.execCommand('insertHTML', false, '<a href="' + esc(href) + '">' + esc(text) + '</a>&nbsp;');
    }
    changed();
  };
  f.querySelector('#lk-ok').addEventListener('click', apply);
  f.querySelector('#lk-no').addEventListener('click', () => { closePop(); restore(); });
  f.querySelector('#lk-rm').addEventListener('click', () => { closePop(); restore(); const cur = ancestor('a'); if (cur) { const r = document.createRange(); r.selectNodeContents(cur); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } document.execCommand('unlink'); changed(); });
  f.addEventListener('keydown', (e) => { if (e.isComposing || e.keyCode === 229) return; if (e.key === 'Enter') { e.preventDefault(); apply(); } });
}
document.addEventListener('mousedown', (e) => { if (popKind && !pop.contains(e.target)) closePop(); });
window.addEventListener('blur', () => { /* 窗口失焦不关弹层 */ });

// ───────── 键盘 ─────────
function autolink() {
  const s = getSelection();
  if (!s.isCollapsed || !s.anchorNode || s.anchorNode.nodeType !== 3) return;
  if (s.anchorNode.parentElement.closest('a')) return;
  const t = s.anchorNode.textContent.slice(0, s.anchorOffset);
  const m = t.match(/(https?:\/\/[^\s<>]+|www\.[a-z0-9-]+\.[a-z]{2,}[^\s<>]*)$/i);
  if (!m) return;
  const r = document.createRange();
  r.setStart(s.anchorNode, s.anchorOffset - m[0].length); r.setEnd(s.anchorNode, s.anchorOffset);
  s.removeAllRanges(); s.addRange(r);
  document.execCommand('createLink', false, /^https?:/i.test(m[0]) ? m[0] : 'https://' + m[0]);
  const a = ancestor('a', s.anchorNode.nodeType === 3 ? s.anchorNode.parentNode : s.anchorNode) || (s.focusNode && ancestor('a', s.focusNode.nodeType === 3 ? s.focusNode.parentNode : s.focusNode));
  const r2 = document.createRange();
  if (a) r2.setStartAfter(a); else { r2.selectNodeContents(ed); r2.collapse(false); }
  r2.collapse(true); s.removeAllRanges(); s.addRange(r2);
}
document.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key === 'Enter') { e.preventDefault(); flush(); post({ t: 'send' }); return; }
  if (e.key === 'Escape') { e.preventDefault(); if (popKind) { closePop(); restore(); } else { flush(); post({ t: 'cancel' }); } return; }
  if (!ed.contains(document.activeElement) && document.activeElement !== ed) return;
  if (mod && !e.shiftKey && e.key.toLowerCase() === 'k') { e.preventDefault(); openPop('link', btns.link); return; }
  if (e.key === 'Tab') {
    e.preventDefault();
    if (ancestor('li')) exec(e.shiftKey ? 'outdent' : 'indent'); else post({ t: e.shiftKey ? 'backtab' : 'tab' });
    return;
  }
  if ((e.key === ' ' || e.key === 'Enter') && !mod) autolink();
}, true);
ed.addEventListener('focus', () => post({ t: 'focus' }));
$('#scroll').addEventListener('mousedown', (e) => { if (e.target === $('#scroll')) { e.preventDefault(); restore(); const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } });
ed.addEventListener('click', (e) => {
  ed.querySelectorAll('img.sel').forEach((i) => i.classList.remove('sel'));
  if (e.target.tagName === 'IMG') { e.target.classList.add('sel'); const r = document.createRange(); r.selectNode(e.target); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  if (e.target.closest && e.target.closest('a')) e.preventDefault();
});

// ───────── 粘贴 / 拖入 ─────────
const ALLOW = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'DEL', 'A', 'BR', 'P', 'DIV', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'SPAN', 'FONT', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'CODE', 'PRE', 'SUB', 'SUP', 'TABLE', 'TBODY', 'THEAD', 'TFOOT', 'TR', 'TD', 'TH', 'HR', 'CENTER']);
const KEEP_STYLE = ['color', 'background-color', 'font-size', 'font-weight', 'font-style', 'text-decoration', 'font-family', 'text-align'];
// 只有宿主生成的引用文档才认 data-token；粘贴进来的 HTML 一律不认，防止伪造 token 引用上传区里的别的文件
let allowTok = false;
function clean(node, out) {
  node.childNodes.forEach((n) => {
    if (n.nodeType === 3) { out.appendChild(document.createTextNode(n.nodeValue.replace(/[\uF700-\uF8FF]/g, ''))); return; }
    if (n.nodeType !== 1) return;
    const tag = n.tagName;
    if (tag === 'IMG') {
      const src = n.getAttribute('src') || '';
      const tok = n.getAttribute('data-token') || '';
      // 引用原邮件时由宿主收进上传区的图片：带 token，src 只是预览，不受大小限制
      if (allowTok && /^[0-9A-Za-z-]+$/.test(tok) && /^data:image\//i.test(src)) { const im = document.createElement('img'); im.setAttribute('data-token', tok); im.setAttribute('src', src); out.appendChild(im); }
      else if (/^data:image\/(png|jpe?g|gif|webp|bmp);base64,/i.test(src) && src.length <= 400000) { const im = document.createElement('img'); im.setAttribute('src', src); const al = n.getAttribute('alt'); if (al) im.setAttribute('alt', al); out.appendChild(im); }
      else { const al = n.getAttribute('alt'); if (al) { const sp = document.createElement('span'); sp.textContent = '[' + al + ']'; out.appendChild(sp); } }
      return;
    }
    if (['SCRIPT', 'STYLE', 'META', 'LINK', 'TITLE', 'HEAD', 'IFRAME', 'OBJECT', 'EMBED', 'SVG', 'VIDEO', 'AUDIO', 'FORM', 'INPUT', 'BUTTON', 'SELECT', 'TEXTAREA'].includes(tag)) return;
    if (!ALLOW.has(tag)) {
      clean(n, out);
      return;
    }
    let el;
    if (/^H[1-6]$/.test(tag)) { el = document.createElement('div'); el.style.fontWeight = '700'; }
    else el = document.createElement(tag.toLowerCase());
    if (tag === 'A') { const h = normUrl(n.getAttribute('href') || ''); if (h) el.setAttribute('href', h); }
    const st = n.style;
    if (st && tag !== 'A') KEEP_STYLE.forEach((p) => { const v = st.getPropertyValue(p); if (v && !/var\(|url\(|expression/i.test(v)) el.style.setProperty(p, v); });
    clean(n, el); out.appendChild(el);
  });
}
ed.addEventListener('paste', (e) => {
  const cd = e.clipboardData; if (!cd) return;
  const files = Array.from(cd.files || []);
  if (files.length) { e.preventDefault(); sendFiles(files); return; }
  const html = cd.getData('text/html');
  if (html) {
    e.preventDefault();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const box = document.createElement('div'); clean(doc.body, box);
    document.execCommand('insertHTML', false, box.innerHTML); changed();
  } else {
    const text = cd.getData('text/plain');
    if (text) { e.preventDefault(); document.execCommand('insertText', false, text); changed(); }
  }
});
function sendFiles(files) {
  const MAX = 25 * 1024 * 1024; const items = []; let pending = files.length;
  const done = () => { if (--pending === 0 && items.length) post({ t: 'files', items }); };
  files.forEach((f) => {
    if (f.size > MAX) { post({ t: 'toast', msg: f.name + '：单个附件不能超过 25 MB' }); done(); return; }
    const r = new FileReader();
    r.onload = () => { const s = String(r.result); items.push({ name: f.name || '粘贴的图片', mime: f.type, data: s.slice(s.indexOf(',') + 1) }); done(); };
    r.onerror = () => done();
    r.readAsDataURL(f);
  });
}
const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
document.addEventListener('dragover', (e) => { if (hasFiles(e)) { e.preventDefault(); document.body.classList.add('dragging'); } });
document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
document.addEventListener('drop', (e) => {
  document.body.classList.remove('dragging');
  if (hasFiles(e)) { e.preventDefault(); sendFiles(Array.from(e.dataTransfer.files)); }
});

// ───────── 给应用调用的接口 ─────────
window.EM = {
  focus(start) {
    ed.focus({ preventScroll: true });
    const r = document.createRange(); r.selectNodeContents(ed); r.collapse(!!start);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); saved = r.cloneRange();
    if (start) $('#scroll').scrollTop = 0;
  },
  insertText(text) { restore(); document.execCommand('insertText', false, text); changed(); },
  insertImage(token, name, src) {
    restore();
    document.execCommand('insertHTML', false, '<img data-token="' + esc(token) + '" alt="' + esc(name) + '" src="' + esc(src) + '">');
    changed();
  },
  html() { return serialize(); },
  text() { return ed.innerText; },
  exec(cmd, val) { exec(cmd, val); },
  openLink() { restore(); openPop('link', btns.link); },
};
const qel = document.getElementById('quote');
if (qel) {
  try {
    const q = JSON.parse(qel.textContent);
    const doc = new DOMParser().parseFromString(q.html, 'text/html');
    const box = document.createElement(q.bq ? 'blockquote' : 'div');
    box.className = 'q';
    allowTok = true; try { clean(doc.body, box); } finally { allowTok = false; }
    ed.appendChild(box);
    ed.appendChild(document.createElement('br'));
    flush();
  } catch (e) {}
}
checkEmpty();
post({ t: 'ready' });
})();

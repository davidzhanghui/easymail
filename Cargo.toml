[package]
name = "easymail"
version = "1.0.2"
edition = "2021"
license = "MIT"
description = "EasyMail · 迷你邮件 —— 本地优先的多账号邮件客户端与归档工具（Rust + GPUI，macOS）"
default-run = "easymail"
repository = "https://github.com/davidzhanghui/easymail"
homepage = "https://davidzhanghui.github.io/easymail/"
readme = "README.md"
keywords = ["email", "imap", "smtp", "gpui", "macos"]
categories = ["email", "gui"]
publish = false

[features]
# 开发用：脚本驱动的端到端测试（EASYMAIL_SCRIPT）。正式打包用 --no-default-features 剔除。
default = ["dev"]
dev = []

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
base64 = "0.22"
rand = "0.10"
unicode-segmentation = "1"
smallvec = "1"
futures = "0.3"
log = "0.4"

# 网络：IMAP / SMTP / TLS / 代理
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
rustls-platform-verifier = "0.6"
tokio-socks = "0.5"
url = "2"
percent-encoding = "2"

# 邮件解析与生成
mail-parser = { version = "0.11", features = ["full_encoding"] }
mail-builder = "0.4"
html2text = "0.13"

# 凭据加密（v1:iv:tag:enc）
aes-gcm = "0.10"
# OAuth2 PKCE 的 code_challenge
sha2 = "0.10"
# 更新包 Ed25519 验签（rustls 已经带了 ring，不增加新的编译依赖）
ring = "0.17"
# 加密备份打包成单个文件
tar = "0.4"
# 发票归集：从 PDF 提取文字（纯 Rust）
pdf-extract = "0.12"
# 发票文字里的康熙部首（⼦⽇⽅…）归一成正常汉字
unicode-normalization = "0.1"

# macOS 原生：WKWebView、Dock 角标、托盘、通知
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSProcessInfo", "NSArray", "NSData", "NSURL", "NSError", "NSDictionary", "NSValue", "NSGeometry", "NSObject", "NSEnumerator", "NSKeyValueCoding", "NSURLRequest", "NSBundle", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSWorkspace", "NSApplication", "NSRunningApplication", "NSDockTile", "NSStatusBar", "NSStatusItem", "NSMenu", "NSMenuItem", "NSButton", "NSControl", "NSCell", "NSButtonCell", "NSStatusBarButton", "objc2-core-foundation", "objc2-core-graphics", "block2"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebpagePreferences", "WKSnapshotConfiguration", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKFrameInfo", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler", "WKWebsiteDataStore", "objc2-app-kit", "block2"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationSound", "UNNotificationTrigger", "UNNotificationSettings", "block2"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
needless_range_loop = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

# 本地 vendored GPUI 0.2.2（EasyMail 补丁：中文字体挑选、避头尾、字体平滑、FORCE_DRAW 截图开关）
[patch.crates-io]
gpui = { path = "vendor/gpui" }

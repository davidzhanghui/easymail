name: Security audit

# 依赖漏洞扫描（RustSec 公告库）：依赖变化时、每周一次、也可手动触发
on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', '.github/workflows/audit.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock']
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

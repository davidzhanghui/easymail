name: Bug 报告
description: 报告一个问题
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: 发生了什么, description: 期望的行为与实际的行为}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: 复现步骤}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: EasyMail 版本 / macOS 版本}
    validations: {required: true}
  - type: input
    id: provider
    attributes: {label: 邮箱服务商（Gmail / 163 / QQ / 自建 …）}
  - type: textarea
    id: log
    attributes: {label: 日志, description: 请先抹掉邮箱地址、主机名等隐私信息, render: text}
